name: render
on:
  workflow_dispatch:
    inputs:
      package:
        description: "Nama paket di bucket (render_in/<package>.zip) atau 'proof'"
        required: true
        default: "proof"
permissions:
  id-token: write
  contents: read
jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Auth ke Google Cloud (keyless WIF)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.WIF_SA }}
      - name: Siapkan gcloud
        uses: google-github-actions/setup-gcloud@v2
      - name: Ambil paket input
        if: ${{ inputs.package != 'proof' }}
        run: |
          gsutil cp "gs://${{ vars.GCS_BUCKET }}/render_in/${{ inputs.package }}.zip" pkg.zip
          mkdir -p work && cd work && unzip -o ../pkg.zip
      - name: Render mode proof
        if: ${{ inputs.package == 'proof' }}
        run: |
          mkdir -p out
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          ffmpeg -y -f lavfi -i testsrc2=size=1080x1920:rate=30 -t 3 -c:v libx265 -preset fast -crf 26 -pix_fmt yuv420p out/proof.mp4
      - name: Render paket
        if: ${{ inputs.package != 'proof' }}
        run: |
          mkdir -p out
          cd work && bash render.sh
          cp -r ../work/out/* ../out/ 2>/dev/null || cp -r out/* ../out/ 2>/dev/null || true
      - name: Unggah hasil ke bucket
        run: |
          gsutil -m cp -r out/* "gs://${{ vars.GCS_BUCKET }}/render_out/${{ inputs.package }}/"
          gsutil ls -l "gs://${{ vars.GCS_BUCKET }}/render_out/${{ inputs.package }}/"
