name: Test Render

on:
  workflow_dispatch:
    inputs:
      label:
        description: 'Label run'
        required: false
        default: 'test-render'
        type: string

jobs:
  test-render:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Tampilkan label
        run: echo "Label: ${{ inputs.label }}"

      - name: Spek runner
        run: |
          echo "vCPU: $(nproc)"
          nproc
          free -h

      - name: Pastikan ffmpeg tersedia
        run: |
          if ! command -v ffmpeg >/dev/null 2>&1; then
            sudo apt-get update && sudo apt-get install -y ffmpeg
          fi
          ffmpeg -version

      - name: Render video uji 10 detik 1080x1920 H.265
        run: |
          START=$(date +%s)
          time ffmpeg -y -f lavfi -i smptebars=size=1080x1920:rate=30:duration=10 -f lavfi -i sine=frequency=1000:duration=10 -c:v libx265 -crf 26 -preset fast -pix_fmt yuv420p -c:a aac -shortest test_render.mp4
          END=$(date +%s)
          echo "Waktu render (detik): $((END - START))"
          ls -lh test_render.mp4

      - name: Periksa hasil render
        run: |
          ffprobe -v error -show_format -show_streams test_render.mp4
          ls -lh test_render.mp4

      - name: Unggah artifact
        uses: actions/upload-artifact@v4
        with:
          name: test-render
          path: test_render.mp4
